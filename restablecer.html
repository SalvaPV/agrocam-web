<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nueva contraseña · AgroCam</title>
<style>
  :root{--bg:#F5F3EC;--surf:#FDFCF8;--on:#1B1A16;--on2:#4A473E;--out:#78746A;--pri:#41591A;--bad:#8F1B15;--ok:#14582A}
  @media (prefers-color-scheme: dark){:root{--bg:#161511;--surf:#201F1A;--on:#F3EFE4;--on2:#C9C4B4;--out:#8E8A7C;--pri:#B9D58A;--bad:#FFB4AB;--ok:#9FD9AE}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--on);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:420px;background:var(--surf);border-radius:24px;padding:28px 24px;display:grid;gap:16px}
  h1{margin:0;font-size:28px;line-height:1.15}
  p{margin:0;color:var(--on2)}
  label{font-weight:700;font-size:16px;display:block;margin-bottom:6px}
  input{width:100%;height:56px;border:1.5px solid var(--out);border-radius:14px;background:transparent;color:var(--on);padding:0 16px;font:inherit}
  input:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
  button{height:56px;border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  @media (prefers-color-scheme: dark){button{color:#10200A}}
  button[disabled]{opacity:.6;cursor:default}
  .msg{min-height:1.5em;font-size:16px}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Nueva contraseña</h1>
  <p id="intro">Escribe la contraseña nueva para tu cuenta de AgroCam.</p>
  <form id="form" class="hidden" novalidate>
    <div style="display:grid;gap:14px">
      <div><label for="p1">Contraseña nueva</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div><label for="p2">Repite la contraseña</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button id="go" type="submit">Guardar contraseña</button>
    </div>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite">Revisando tu enlace…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // La llave "publishable" es pública por diseño: la seguridad real está en las reglas (RLS) de la base de datos.
  var client = supabase.createClient("https://hukgtjdehkgnvgdsrdky.supabase.co", "sb_publishable_7CxwXa7bp5rI2iXs3BoqIA_4xnlcI-0");
  var form = document.getElementById("form"), msg = document.getElementById("msg"), go = document.getElementById("go");
  function say(text, kind){ msg.textContent = text; msg.className = "msg" + (kind ? " " + kind : ""); }
  var ready = false;
  function show(){ ready = true; form.classList.remove("hidden"); say(""); }
  client.auth.onAuthStateChange(function(event){ if (event === "PASSWORD_RECOVERY") show(); });
  setTimeout(function(){
    if (!ready) say("Este enlace venció o ya se usó. Pide uno nuevo desde la app, en «Olvidé mi contraseña».", "bad");
  }, 2500);
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var a = document.getElementById("p1").value, b = document.getElementById("p2").value;
    if (a.length < 8) return say("Usa al menos 8 letras o números.", "bad");
    if (a !== b) return say("Las dos contraseñas no coinciden.", "bad");
    go.disabled = true; say("Guardando…");
    client.auth.updateUser({ password: a }).then(function(r){
      if (r.error) { go.disabled = false; return say("No se pudo guardar: " + r.error.message, "bad"); }
      form.classList.add("hidden");
      document.getElementById("intro").textContent = "Listo.";
      say("Tu contraseña cambió. Ya puedes volver a la app y entrar con ella.", "ok");
      client.auth.signOut();
    });
  });
</script>
</body>
</html>
